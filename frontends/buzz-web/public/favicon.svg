<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 24" role="img" aria-labelledby="ferrite-mark-title">
  <title id="ferrite-mark-title">Ferrite</title>
  <!-- The Ferrite blades, as an asset: three round-backed, flat-faced blades
       in ember (#d43d1a) at falling opacity, leaning 12 degrees, each with
       the inset shade on its flat edge. Geometry matches the owned-auth
       wordmark (/_ferrite/owned-auth/auth.css .wordmark-mark) with the CSS
       border-radius clamping resolved: left corners round at the full blade
       width, right corners square. -->
  <g transform="rotate(12 14 12)" fill="#d43d1a">
    <g>
      <path d="M 9,2.5 L 9,17.5 A 6 6 0 0 1 3,11.5 L 3,8.5 A 6 6 0 0 1 9,2.5 Z"/>
      <rect x="7" y="2.5" width="2" height="15" fill="#47120a" fill-opacity="0.24"/>
    </g>
    <g opacity="0.82">
      <path d="M 17,1 L 17,19 A 6 6 0 0 1 11,13 L 11,7 A 6 6 0 0 1 17,1 Z"/>
      <rect x="15" y="1" width="2" height="18" fill="#47120a" fill-opacity="0.24"/>
    </g>
    <g opacity="0.62">
      <path d="M 25,3 L 25,17 A 6 6 0 0 1 19,11 L 19,9 A 6 6 0 0 1 25,3 Z"/>
      <rect x="23" y="3" width="2" height="14" fill="#47120a" fill-opacity="0.24"/>
    </g>
  </g>
</svg>
